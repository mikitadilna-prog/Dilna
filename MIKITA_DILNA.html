<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOBIRA WORKSHOP – evidence dílny</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#C0392B;--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#7a7a7a;--bd:#e3e0dc;--yel:#d9a400;--ok:#2e7d32}
*{box-sizing:border-box}body{margin:0;font:300 15px/1.45 Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#111827;height:65px;padding:0 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--red)}
header img.lg{height:46px;display:block}header .ttl{color:#fff;font-weight:500;letter-spacing:.12em;font-size:13px;margin-left:6px}header .sp{flex:1}
.lang{display:flex}.lang button{border:1px solid #374151;background:transparent;color:#d1d5db;padding:5px 10px;cursor:pointer;font-weight:600}.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0}.lang button.on{background:var(--red);color:#fff;border-color:var(--red)}
#user{color:#9ca3af;font-size:13px}#logout{border:0;background:none;color:#fff;cursor:pointer;font-size:13px}#mode{background:#fff3cd;color:#7a5b00;font-size:12px;padding:3px 8px;border-radius:6px}#sync{color:var(--red)}
#nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:65px;z-index:19}
.tab{border:0;background:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:15px;white-space:nowrap;color:#444}.tab.on{background:var(--red);color:#fff}
main{padding:14px;max-width:1300px;margin:0 auto;min-height:calc(100vh - 200px)}
footer{background:#111827;height:70px;display:flex;align-items:center;justify-content:center;gap:14px;color:#9ca3af;font-size:12px;letter-spacing:.3em;font-weight:300}footer img{height:32px}
.lbox .lang button{color:#111827;border-color:#ccc}.lbox .lang button.on{color:#fff;border-color:var(--red)}.lbox h2{margin:0 0 6px}.lbox img{height:46px;background:#111827;padding:10px 14px;border-radius:8px;align-self:center}
tr.done td{color:#9ca3af;background:#f3f4f6}input.lim{width:70px;padding:5px;border:1px solid #ccc;border-radius:6px}.o{font-size:.82em;color:#555;font-weight:300}.rr{flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.grid .wide{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}.grid .card{margin:0}.card h3{margin:0 0 10px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}.c{text-align:center}.nw{white-space:nowrap}.muted{color:var(--mu)}.neg{color:var(--red)}.pos{color:var(--ok)}tr.warn td{background:#fdeceb}tr.off td{opacity:.5}
.clk-row{cursor:pointer}.clk-row:hover td{background:#faf6f5}
.btn{border:1px solid var(--bd);background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}.btn.sm{padding:4px 9px;font-size:13px}.btn:disabled{opacity:.4}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.search{flex:1;min-width:180px;padding:9px;border:1px solid var(--bd);border-radius:8px;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer}.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.clk{stroke:var(--yel)}.clk.red{stroke:var(--red)}svg.clk{vertical-align:middle}
#modal,#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50}#dlg{z-index:60;align-items:center}
#modal.open,#dlg.open{display:flex}.mbox,.box{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto}.mbox.wide{max-width:900px}.box{max-width:440px}
.mbox h2{margin:0 0 10px;font-size:18px}.mbox h4{margin:16px 0 6px}.kvs{margin-bottom:10px}
.f{margin-bottom:11px}.f.hide{display:none}.f>label{display:block;font-size:13px;color:#555;margin-bottom:3px}
input[type=text],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;background:#fff}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}.chk input{width:18px;height:18px}.checks{max-height:230px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}.lnk{color:var(--red);cursor:pointer;font-size:13px}
.hint{font-size:12px;color:var(--mu);margin-top:2px}.info{padding:8px 10px;background:#f6f5f3;border-radius:8px}
.rr{display:flex;gap:6px;align-items:flex-end;margin-bottom:6px}.rc small{display:block;font-size:11px;color:var(--mu)}.rc{min-width:0}.rr .x{border:0;background:none;font-size:22px;color:var(--red);cursor:pointer}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.btns.left{justify-content:flex-start}
.msg{font-size:15px;margin-bottom:6px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:90%}#toast.show{opacity:1}#toast.err{background:var(--red)}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:14px}.lbox{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}.lbox .err{color:var(--red);min-height:18px;font-size:13px}.lbox .lg{justify-content:center;margin-top:8px}
#printArea{display:none}
@media (max-width:640px){main{padding:10px}header h1{font-size:15px}th,td{padding:6px 5px;font-size:14px}.btn{padding:10px 12px}}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing{background:#fff}body.printing #printArea{display:block}
.pdoc{page-break-after:always;font-size:11pt;color:#000;font-weight:400}.pdoc:last-child{page-break-after:auto}
.pstrip{background:#111827!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;align-items:center;gap:14px;padding:8px 14px;margin-bottom:10px}
.pstrip .tor{height:46px}.pst .t1{color:#fff;font-size:14pt;font-weight:600}.pst .t2{color:#d1d5db;font-size:10pt}
.pstrip .pn{margin-left:auto;color:#fff;text-align:right;font-size:10pt}.pstrip .pn b{font-size:12pt}.pmeta{display:flex;justify-content:space-between;margin:6px 0 8px;font-size:10pt}.pv{font-weight:600}.ct{white-space:nowrap}
.pdoc table{border-collapse:collapse;width:100%}.pdoc th,.pdoc td{border:1px solid #000;padding:4px 5px;font-size:10pt;color:#000;text-transform:none;letter-spacing:0;font-weight:400}.pdoc td.r{text-align:right}.pdoc .o{color:#333;font-size:8.5pt}.sig{display:flex;justify-content:space-between;margin-top:40px}}
</style></head><body>

function sessFrom(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in - 60) * 1000, email: (j.user && j.user.email) || (SESS && SESS.email) || '' }; }
async function login(email, pw) {
  const r = await fetch(CFG.SUPABASE_URL + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CFG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pw }) });
  if (!r.ok) throw new Error('login');
  saveSess(sessFrom(await r.json()));
  USER = SESS.email;
}
async function refreshTok() {
  if (!SESS || !SESS.refresh_token) throw new Error('nosess');
  const r = await fetch(CFG.SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: SESS.refresh_token }) });
  if (!r.ok) { saveSess(null); throw new Error('expired'); }
  saveSess(sessFrom(await r.json()));
}
async function ensureAuth() { if (SESS && SESS.expires_at < Date.now()) await refreshTok(); }
async function rest(path, opt) {
  opt = opt || {};
  await ensureAuth();
  const r = await fetch(CFG.SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opt, {
    headers: Object.assign({ apikey: CFG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, SESS ? { Authorization: 'Bearer ' + SESS.access_token } : {}, opt.headers || {})
  }));
  if (!r.ok) throw new Error(r.status + ' ' + await r.text());
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

const LSK = 'dilna_data_v1';
let lsTimer = null;
function lsSave() { clearTimeout(lsTimer); lsTimer = setTimeout(() => { try { localStorage.setItem(LSK, JSON.stringify(S)); } catch (e) { toast(t('err_ls'), 1); } }, 150); }
async function loadAll() {
  if (!REMOTE) {
    try { const d = JSON.parse(localStorage.getItem(LSK) || 'null'); if (d) TABLES.forEach(tb_ => S[tb_] = d[tb_] || []); } catch (e) { }
    return;
  }
  for (const tbl of TABLES) {
    let all = [], o = 0;
    for (;;) {
      const rows = await rest(tbl + '?select=*', { headers: { 'Range-Unit': 'items', Range: o + '-' + (o + 999) } });
      all = all.concat(rows || []);
      if (!rows || rows.length < 1000) break;
      o += 1000;
    }
    S[tbl] = all;
  }
}
function mk(tbl, o) {
  const r = {};
  COLS[tbl].forEach(c => r[c] = o[c] === undefined ? null : o[c]);
  if (!PK[tbl] && !r.id) r.id = uid();
  if (COLS[tbl].includes('created_at') && !r.created_at) r.created_at = nowISO();
  return r;
}
function put(tbl, row) {                // lokální změna v paměti
  const k = PK[tbl] || 'id';
  const i = S[tbl].findIndex(x => x[k] === row[k]);
  if (i >= 0) S[tbl][i] = row; else S[tbl].push(row);
}
let PENDING = 0;
async function saveRows(tbl, rows) {
  if (!Array.isArray(rows)) rows = [rows];
  rows.forEach(r => put(tbl, r));
  if (!REMOTE) { lsSave(); return; }
  PENDING++; setSync();
  try {
    for (let i = 0; i < rows.length; i += 200)
      await rest(tbl + '?on_conflict=' + (PK[tbl] || 'id'), { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows.slice(i, i + 200)) });
  } catch (e) { console.error(e); toast(t('err_save') + ' ' + String(e.message).slice(0, 120), 1); throw e; }
  finally { PENDING--; setSync(); }
}
async function delRow(tbl, id) {
  const k = PK[tbl] || 'id';
  S[tbl] = S[tbl].filter(x => x[k] !== id);
  if (!REMOTE) { lsSave(); return; }
  await rest(tbl + '?' + k + '=eq.' + encodeURIComponent(id), { method: 'DELETE' });
}

  try { await saveRows('historie', mk('historie', { uzivatel: USER, akce, tabulka: tbl, zaznam: zaznam == null ? '' : String(zaznam), detail: detail || null })); } catch (e) { }
}

function interp(tab, x) {
  if (x <= tab[0][0]) return tab[0][1];
  for (var i = 1; i < tab.length; i++) {
    if (x <= tab[i][0]) {
      var a = tab[i-1], b = tab[i];
      return a[1] + (b[1]-a[1]) * (x-a[0]) / (b[0]-a[0]);
    }
  }
  return tab[tab.length-1][1];
}

function compute(p) {
  var c = CUTS[p.cut];
  if (!c) return {err: 'Vyber brus.'};
  if (!p.stone) return {err: 'Vyber druh kamene, nebo zadej hustotu ručně.'};
  var sg = p.sg;
  if (!(sg > 0.5 && sg < 12)) return {err: 'Zadej hustotu kamene (SG), např. 3,52.'};
  var L = p.L, W = p.W, D = p.D, notes = [];
  if (!(L > 0)) return {err: 'Zadej délku (průměr) v mm.'};
  if (L > 300 || (W && W > 300) || (D && D > 300)) return {err: 'Rozměry jsou v mm. Zkontroluj, jestli nejsou zadané omylem v jiné jednotce.'};
  var wMissing = !(W > 0);
  if (wMissing) { W = L; if (p.cut !== 'round' && p.cut !== 'bead') notes.push({w:1, t:'Šířka nezadána, použita stejná jako délka.'}); }
  var hasD = D > 0;
  var grp = p.grp;
  var route = grp === 'col' ? 'col' : 'dia';
  var spec = c[route];
  var like = grp === 'like' ? sg / 3.52 : 1;
  var avg = (L + W) / 2, Lm = Math.max(L, W), Wm = Math.min(L, W), ratio = Lm / Wm;
  var f = spec.f(ratio);
  var bellyPct = spec.sg || route === 'col' ? 10 : 5;
  var depthEst = false, melee = false, w, depthUsed = null;

  if (p.cut === 'round' && route === 'dia' && !hasD && avg <= MELEE_MAX && !spec.sg) {
    melee = true;
    var base = avg < 0.9 ? MELEE[0][1] * Math.pow(avg / 0.9, 3) : interp(MELEE, avg);
    w = base * like;
    notes.push({t:'Výška nezadána: použita tabulka pro kulaté diamanty do ' + fm(MELEE_MAX - 0.05, 2) + ' mm od zlatníka (VS1–VS2, G–F).'});
  } else {
    if (!hasD) {
      if (spec.geom) D = avg; else D = spec.dd * (spec.kind === 'avg' ? avg : Wm);
      if (!spec.geom) { depthEst = true; notes.push({w:1, t:'Výška odhadnuta na ' + Math.round(spec.dd*100) + ' % šířky. Zadej naměřenou výšku pro přesnější výsledek.'}); }
    }
    depthUsed = D;
    w = (spec.kind === 'avg' ? avg * avg : L * W) * D * f * (spec.sg || route === 'col' ? sg : 1) * like;
    var dp = D / (spec.kind === 'avg' ? avg : Wm);
    if (hasD && !spec.geom && p.cut !== 'cabround' && p.cut !== 'cabrect') {
      if (dp < 0.45 || dp > 0.95) notes.push({w:1, t:'Výška je ' + Math.round(dp*100) + ' % šířky, což je neobvyklé. Zkontroluj měření.'});
    }
  }

  var corr = 1 + (p.belly || 0) * bellyPct / 100;
  w = w * corr;
  if (p.belly) notes.push({t: (p.belly < 0 ? 'Menší' : 'Větší') + ' bříško: ' + (p.belly < 0 ? '−' : '+') + bellyPct + ' %.'});
  if (p.cut === 'cabround' || p.cut === 'cabrect') notes.push({w:1, t:'Kabošon: skutečné klenutí může změnit váhu víc, GIA uvádí −25 % až +35 %.'});
  if (spec.other) notes.push({w:1, t:'Pro tento tvar není ověřený faktor. Výsledek je jen hrubý odhad.'});
  else if (!spec.ok) notes.push({w:1, t:'Faktor tvaru není z GIA, je z neoficiálního zdroje nebo odvozený.'});
  if (grp === 'like') notes.push({t:'Náhrada diamantu: vzorec diamantu přepočtený hustotou ' + fm(sg, 2) + ' / 3,52.'});

  // nejistota
  var u2 = Math.pow(route === 'dia' ? 4 : 6, 2);
  if (spec.other) u2 += 225; else if (!spec.ok) u2 += 64;
  if (depthEst) u2 += 144;
  if (melee) u2 += 36;
  if (spec.geom) u2 = 9 + (hasD ? 0 : 16);
  var u = Math.max(3, Math.round(Math.sqrt(u2)));

  var formula;
  if (melee) formula = 'ct = hodnota z tabulky pro průměr ' + fm(avg, 2) + ' mm';
  else formula = (spec.kind === 'avg' ? 'ct = Ø² × Výška' : 'ct = Délka × Šířka × Výška') +
    (spec.sg || route === 'col' ? ' × hustota' : '') + ' × ' + fm(f, spec.kind === 'avg' ? 4 : 5) +
    (like !== 1 ? ' × ' + fm(like, 3) : '');

  return {ct: w, lo: w * (1 - u/100), hi: w * (1 + u/100), u: u, notes: notes, formula: formula,
          factor: f, depth: depthUsed, depthEst: depthEst, melee: melee, route: route, sg: sg,
          src: route === 'col' ? 'GIA, Carmona 1998 (barevné kameny)' : 'GIA vzorce pro diamanty'};
}

const stoneKey = (p, maj) => [maj || movMaj(p), p.druh || '', p.puvod || '', p.brus || '', fx(p.mm), fx(p.sirka), fx(p.vyska), p.cistota || '', p.barva || '', p.cert_cislo || (p.cert ? 'ano' : 'ne')].join('|');
const limitKey = (p, maj) => [maj || movMaj(p), p.druh || '', p.puvod || '', p.brus || '', fx(p.mm), fx(p.sirka)].join('|');
function stoneStock(maj) {

  S.pohyby_kamenu.filter(p => !maj || movMaj(p) === maj).slice().sort((a, b) => (a.created_at || '').localeCompare(b.created_at || '')).forEach(p => {
    const k = stoneKey(p);
    const o = m[k] || (m[k] = { key: k, lkey: limitKey(p), majitel: movMaj(p), druh: p.druh, puvod: p.puvod || 'prirodni', brus: p.brus, mm: Number(p.mm), sirka: p.sirka != null ? Number(p.sirka) : null, vyska: p.vyska != null ? Number(p.vyska) : null, cistota: p.cistota || '', barva: p.barva || '', cert: !!p.cert, cert_cislo: p.cert_cislo || '', ct_ks: null, ks: 0 });
    o.ks += Number(p.ks || 0);
    if (p.ct_ks != null) o.ct_ks = Number(p.ct_ks);

  return Object.values(m).sort((a, b) => druhName(a.druh).localeCompare(druhName(b.druh)) || a.puvod.localeCompare(b.puvod) || brusName(a.brus).localeCompare(brusName(b.brus)) || a.mm - b.mm);
}
function ruleLimit(brus, size) {            // pravidla z Nastavení; limit 0 = bez upozornění
  const rules = getSet('prahy'), eps = 1e-9;
  const hit = r => size >= Number(r.od) - eps && size <= Number(r.do) + eps;
  const spec = rules.filter(r => r.brus === brus);
  if (spec.length) { const r = spec.find(hit); if (r) return Number(r.limit) > 0 ? Number(r.limit) : null; }
  const w = rules.find(r => r.brus === '*' && hit(r));

}

}

}

async function opHandover(s, o) {     // předat mistrovi: mistr,typ,datum,vaha,zdroj,kameny[{key,ks}]
  const e = mk('etapy', { sperk_id: s.id, datum: o.datum, mistr: o.mistr, typ: o.typ, vaha_vydana: o.vaha, poznamka: o.poznamka });

    mv.push(mk('pohyby_kamenu', { datum: o.datum, druh: ln.druh, puvod: ln.puvod, brus: ln.brus, mm: ln.mm, sirka: ln.sirka, vyska: ln.vyska, cistota: ln.cistota, barva: ln.barva, cert: ln.cert, cert_cislo: ln.cert_cislo, ct_ks: ln.ct_ks, ks: -Math.abs(k.ks), typ: 'vydej', sperk_id: s.id, mistr: o.mistr, majitel: zdroj }));
    used.push({ ln, ks: Math.abs(k.ks) });
  });
  if (mv.length) await saveRows('pohyby_kamenu', mv);
  if (zdroj !== smaj) for (const u of used) await addLoan({ datum: o.datum, typ: 'kameny', od: zdroj, komu: smaj, popis: stoneLabel(u.ln), mnozstvi: u.ks, sperk_id: s.id, klic: { druh: u.ln.druh, puvod: u.ln.puvod, brus: u.ln.brus, mm: u.ln.mm, sirka: u.ln.sirka, vyska: u.ln.vyska, cistota: u.ln.cistota, barva: u.ln.barva, cert: u.ln.cert, cert_cislo: u.ln.cert_cislo, ct_ks: u.ln.ct_ks } });

  const lk = used.map(u => u.ln.lkey).filter((x, i, a) => a.indexOf(x) === i);

}

document.addEventListener('submit', async e => {

const DOC_T = { vydejka_butik: 'doc_vydejka', vratka: 'doc_vratka', protokol_vyber: 'doc_protokol_vyber', protokol_punc: 'doc_protokol_punc', protokol_zpet: 'doc_protokol_zpet', protokol_zpet_punc: 'doc_protokol_zpet_punc' };
const biT = k => esc(t(k)) + '<small>' + esc(tl(k, OTHER())) + '</small>';           // aktivní jazyk velký, druhý menší
const biLine = k => esc(t(k)) + ' / ' + esc(tl(k, OTHER()));
function docStone(k) {
  const one = lang => {
    let s = druhFull(k.druh, lang) + ', ' + brusName(k.brus, lang) + ', ' + dimTxt(k) + ' mm (' + k.ks + ' ' + tl('ks', lang) + (k.ct_ks != null ? ' – ' + fmtN(k.ct_ks, 3) + ' ct' : '') + ')';
    const x = [];
    if (k.cistota) x.push(tl('doc_cistota', lang) + ' ' + k.cistota);
    if (k.barva) x.push(tl('doc_barva', lang) + ' ' + k.barva);
    if (k.cert) x.push(tl('doc_cert', lang) + (k.cert_cislo ? ' #' + k.cert_cislo : ''));
    return s + (x.length ? ', ' + x.join(', ') : '');
  };
  return '<div>' + esc(one(LANG)) + '</div><div class="o">' + esc(one(OTHER())) + '</div>';
}
const ctSum = ks => (ks || []).reduce((a, k) => a + (k.ct_ks != null ? Number(k.ct_ks) * Number(k.ks || 0) : 0), 0);
function docHtml(doc, kopie) {
  const typ = doc.typ, punc = typ === 'protokol_punc' || typ === 'protokol_zpet_punc', vr = typ === 'vratka';
  const toButik = doc.smer !== 'butik>dilna';
  const dir = toButik ? biLine('doc_dilna') + ' → ' + biLine('doc_butik') : biLine('doc_butik') + ' → ' + biLine('doc_dilna');
  let total = 0, totalCt = 0;
  const rows = (doc.polozky || []).map((p, i) => {
    total += Number(p.vaha || 0);
    const all = (p.kameny || []).concat(p.kb || []);
    const ct = ctSum(all); totalCt += ct;
    const st = (p.kameny || []).map(docStone).join('') + ((p.kb || []).length ? (p.kameny && p.kameny.length ? '<hr>' : '') + p.kb.map(docStone).join('') : '');
    return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(p.kod) + '</b></td><td>' + esc(kovLabel(p.kov)) + ' ' + esc(barvaLabel(p.barva)) + ' ' + esc(ryzLabel(p.kov, p.ryzost)) + '</td><td class="r">' + fmtN(p.vaha, 2) + '</td><td>' + esc(p.velikost || '') + '</td><td>' + st + (ct > 0 ? '<div class="ct"><b>' + esc(t('doc_ct_celkem')) + ': ' + fmtN(ct, 3) + ' ct</b></div>' : '') + '</td>' +
      (punc ? '<td>' + esc(majLabel(p.majitel)) + '</td>' : '') + (vr ? '<td>' + esc(p.duvod ? t('z_' + p.duvod) : '') + '</td>' : '') + '<td>' + esc(p.poznamka || '') + '</td></tr>';
  }).join('');
  const nc = 6 + (punc ? 1 : 0) + (vr ? 1 : 0);
  return '<section class="pdoc"><div class="pstrip"><img class="tor" src="' + TORII_SRC + '" alt=""><div class="pst"><div class="t1">' + esc(t(DOC_T[typ])) + '</div><div class="t2">' + esc(tl(DOC_T[typ], OTHER())) + '</div></div><div class="pn"><b>' + esc(doc.cislo) + '</b><br>' + esc(fmtD(doc.datum)) + '</div></div>' +
    '<div class="pmeta"><div class="pd">' + dir + '</div><div class="pv">' + biLine('vystavil') + ': <b>' + esc(doc.vystavil || '') + '</b></div></div><div class="pk">' + esc(kopie) + '</div>' +
    '<table><thead><tr><th>#</th><th>ID</th><th>' + biT('h_kov') + '</th><th>' + (typ === 'protokol_zpet_punc' ? biT('doc_vaha_po') : 'g') + '</th><th>' + biT('h_velikost') + '</th><th>' + biT('h_kameny') + '</th>' + (punc ? '<th>' + biT('h_majitel') + '</th>' : '') + (vr ? '<th>' + biT('doc_duvod') + '</th>' : '') + '<th>' + biT('h_poznamka') + '</th></tr></thead><tbody>' + rows + '</tbody><tfoot><tr><td colspan="3">' + biLine('celkem') + ': ' + (doc.polozky || []).length + ' ' + esc(t('ks')) + '</td><td class="r"><b>' + fmtN(total, 2) + '</b></td><td></td><td>' + (totalCt > 0 ? '<b>' + esc(t('doc_ct_celkem')) + ': ' + fmtN(totalCt, 3) + ' ct</b>' : '') + '</td>' + '<td colspan="' + (nc - 6 + 1) + '"></td></tr></tfoot></table>' +

  const lim = canEdit ? '<input class="lim" data-lkey="' + esc(s.lkey) + '" inputmode="numeric" value="' + (own !== undefined && own !== null ? esc(own) : '') + '" placeholder="' + (auto === null ? esc(t('limit_bez')) : auto) + '">' : '<span class="muted">' + (own !== undefined && own !== null ? esc(own) : (auto === null ? '—' : auto)) + '</span>';
  return '<tr class="' + (low ? 'warn' : '') + '"><td>' + esc(druhName(s.druh)) + '</td><td>' + esc(t('p_' + (s.puvod || 'prirodni'))) + '</td><td>' + esc(brusName(s.brus)) + '</td><td class="r">' + dimTxt(s) + '</td>' +

}

async function driveUpload(name, text) {
  if (!CFG.GOOGLE_CLIENT_ID) throw new Error(t('err_drive_cfg'));
  if (!window.google || !google.accounts) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = res; s.onerror = () => rej(new Error('GIS')); document.head.appendChild(s); });
  const token = await new Promise((res, rej) => { const c = google.accounts.oauth2.initTokenClient({ client_id: CFG.GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file', callback: r => r.access_token ? res(r.access_token) : rej(new Error(r.error || 'oauth')) }); c.requestAccessToken(); });
  const meta = { name, mimeType: 'application/json' }; if (CFG.GOOGLE_DRIVE_FOLDER_ID) meta.parents = [CFG.GOOGLE_DRIVE_FOLDER_ID];
  const b = '-----dilna', body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + text + '\r\n--' + b + '--';
  const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + b }, body });
  if (!r.ok) throw new Error('Drive ' + r.status);
}
